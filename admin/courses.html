<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Courses - ChrisTech Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">CT</div>
        <div class="sidebar-brand">
          <h1>ChrisTech Academy</h1>
          <span>Admin Portal</span>
        </div>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <div class="sidebar-user" id="user-menu">
          <div class="avatar" id="user-avatar">A</div>
          <div class="sidebar-user-info">
            <div class="sidebar-user-name" id="user-name">Loading...</div>
            <div class="sidebar-user-role">Administrator</div>
          </div>
        </div>
      </div>
    </aside>

    <div class="sidebar-overlay"></div>

    <main class="main">
      <header class="header">
        <div class="header-left">
          <button class="mobile-menu-btn" id="mobile-menu-btn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="3" y1="12" x2="21" y2="12"/>
              <line x1="3" y1="6" x2="21" y2="6"/>
              <line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
          </button>
          <h2 class="header-title">Manage Courses</h2>
        </div>
        <div class="header-right">
          <button class="btn btn-primary" onclick="openModal('course-modal')">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="12" y1="5" x2="12" y2="19"/>
              <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            Add Course
          </button>
          <button class="header-btn" id="logout-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
          </button>
        </div>
      </header>

      <div class="content">
        <!-- Filters -->
        <div class="card" style="margin-bottom: var(--space-6);">
          <div class="card-body">
            <div style="display: flex; gap: var(--space-4); flex-wrap: wrap; align-items: center;">
              <div class="search-input" style="flex: 1; min-width: 200px;">
                <span class="search-input-icon">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                  </svg>
                </span>
                <input type="text" id="search-courses" class="form-control" placeholder="Search courses..." style="padding-left: 2.5rem;">
              </div>
              <select id="filter-status" class="form-control" style="width: auto; min-width: 150px;">
                <option value="">All Status</option>
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Courses List -->
        <div id="courses-container">
          <div class="loading-state">
            <div class="spinner"></div>
            <p>Loading courses...</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Course Modal -->
  <div class="modal" id="course-modal">
    <div class="modal-content modal-lg">
      <div class="modal-header">
        <h3 id="modal-title">Add New Course</h3>
        <button class="modal-close" onclick="closeModal('course-modal')">&times;</button>
      </div>
      <div class="modal-body">
        <form id="course-form">
          <input type="hidden" id="course-id">
          <div class="admin-form-grid">
            <div class="form-group">
              <label class="form-label">Course Name <span class="required">*</span></label>
              <input type="text" id="course-name" class="form-control" required>
            </div>
            <div class="form-group">
              <label class="form-label">Course Code <span class="required">*</span></label>
              <input type="text" id="course-code" class="form-control" required>
            </div>
            <div class="form-group" style="grid-column: span 2;">
              <label class="form-label">Description</label>
              <textarea id="course-description" class="form-control" rows="3"></textarea>
            </div>
            <div class="form-group">
              <label class="form-label">Duration</label>
              <input type="text" id="course-duration" class="form-control" placeholder="e.g., 3 months">
            </div>
            <div class="form-group">
              <label class="form-label">Fee (KES) <span class="required">*</span></label>
              <input type="number" id="course-fee" class="form-control" min="0" required>
            </div>
            <div class="form-group">
              <label class="form-label">Learning Modes <span class="required">*</span></label>
              <div style="display: flex; gap: var(--space-4);">
                <label class="form-check">
                  <input type="checkbox" name="learning_modes" value="online" class="form-check-input" checked>
                  <span class="form-check-label">Online</span>
                </label>
                <label class="form-check">
                  <input type="checkbox" name="learning_modes" value="physical" class="form-check-input">
                  <span class="form-check-label">Physical</span>
                </label>
                <label class="form-check">
                  <input type="checkbox" name="learning_modes" value="hybrid" class="form-check-input">
                  <span class="form-check-label">Hybrid</span>
                </label>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">Status</label>
              <select id="course-status" class="form-control">
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
              </select>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('course-modal')">Cancel</button>
        <button class="btn btn-primary" id="save-course-btn">Save Course</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/utilities.js"></script>
  <script>
    let currentUser = null;
    let currentProfile = null;
    let courses = [];
    let editingCourseId = null;

    document.addEventListener('DOMContentLoaded', async function() {
      initSupabase();
      initMobileMenu();

      const authResult = await checkAuth('admin');
      if (!authResult) return;

      currentUser = authResult.user;
      currentProfile = authResult.profile;

      initSidebar(currentProfile);
      document.getElementById('user-name').textContent = currentProfile.full_name;
      document.getElementById('user-avatar').textContent = currentProfile.full_name.charAt(0).toUpperCase();

      // Load courses
      loadCourses();

      // Search and filter
      document.getElementById('search-courses').addEventListener('input', debounce(filterCourses, 300));
      document.getElementById('filter-status').addEventListener('change', filterCourses);

      // Save course
      document.getElementById('save-course-btn').addEventListener('click', handleSaveCourse);

      // Reset form on modal close
      document.getElementById('course-modal').addEventListener('click', function(e) {
        if (e.target === this || e.target.classList.contains('modal-close')) {
          resetCourseForm();
        }
      });

      // Logout
      document.getElementById('logout-btn').addEventListener('click', async () => {
        await auth.signOut();
        window.location.href = '/login.html';
      });
    });

    async function loadCourses() {
      try {
        const { data, error } = await getSupabase()
          .from('courses')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) throw error;
        courses = data || [];
        renderCourses(courses);
      } catch (error) {
        console.error('Error loading courses:', error);
        showError(document.getElementById('courses-container'), 'Failed to load courses');
      }
    }

    function filterCourses() {
      const search = document.getElementById('search-courses').value.toLowerCase();
      const status = document.getElementById('filter-status').value;

      let filtered = courses.filter(course => {
        const matchesSearch = course.name.toLowerCase().includes(search) ||
                            course.course_code.toLowerCase().includes(search);
        const matchesStatus = !status || course.status === status;
        return matchesSearch && matchesStatus;
      });

      renderCourses(filtered);
    }

    function renderCourses(coursesToRender) {
      const container = document.getElementById('courses-container');

      if (!coursesToRender || coursesToRender.length === 0) {
        showEmpty(container, 'No courses found. Click "Add Course" to create one.');
        return;
      }

      container.innerHTML = `
        <div class="table-container">
          <table class="table">
            <thead>
              <tr>
                <th>Course</th>
                <th>Code</th>
                <th>Duration</th>
                <th>Fee</th>
                <th>Learning Modes</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              ${coursesToRender.map(course => `
                <tr>
                  <td>
                    <div style="font-weight: 500;">${course.name}</div>
                    <div style="font-size: var(--text-xs); color: var(--text-muted); max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${course.description || 'No description'}</div>
                  </td>
                  <td><code style="font-size: var(--text-xs);">${course.course_code}</code></td>
                  <td>${course.duration || 'N/A'}</td>
                  <td>${formatCurrency(course.fee)}</td>
                  <td>
                    <div style="display: flex; gap: var(--space-1); flex-wrap: wrap;">
                      ${(course.learning_modes || '').split(',').map(mode => `
                        <span class="badge badge-secondary">${mode.trim()}</span>
                      `).join('')}
                    </div>
                  </td>
                  <td>
                    <span class="badge badge-${course.status === 'active' ? 'success' : 'secondary'}">${course.status}</span>
                  </td>
                  <td>
                    <div style="display: flex; gap: var(--space-2);">
                      <button class="btn btn-ghost btn-sm" onclick="editCourse('${course.id}')">Edit</button>
                      <button class="btn btn-ghost btn-sm" onclick="toggleCourseStatus('${course.id}', '${course.status}')">
                        ${course.status === 'active' ? 'Deactivate' : 'Activate'}
                      </button>
                    </div>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    function editCourse(courseId) {
      const course = courses.find(c => c.id === courseId);
      if (!course) return;

      editingCourseId = courseId;
      document.getElementById('modal-title').textContent = 'Edit Course';
      document.getElementById('course-id').value = courseId;
      document.getElementById('course-name').value = course.name;
      document.getElementById('course-code').value = course.course_code;
      document.getElementById('course-description').value = course.description || '';
      document.getElementById('course-duration').value = course.duration || '';
      document.getElementById('course-fee').value = course.fee;
      document.getElementById('course-status').value = course.status;

      // Set learning modes
      const modes = (course.learning_modes || '').split(',');
      document.querySelectorAll('input[name="learning_modes"]').forEach(cb => {
        cb.checked = modes.includes(cb.value);
      });

      openModal('course-modal');
    }

    async function toggleCourseStatus(courseId, currentStatus) {
      const newStatus = currentStatus === 'active' ? 'inactive' : 'active';

      try {
        const { error } = await getSupabase()
          .from('courses')
          .update({ status: newStatus })
          .eq('id', courseId);

        if (error) throw error;

        showToast(`Course ${newStatus === 'active' ? 'activated' : 'deactivated'} successfully`, 'success');
        loadCourses();

      } catch (error) {
        console.error('Error updating course:', error);
        showToast('Failed to update course status', 'error');
      }
    }

    async function handleSaveCourse() {
      const name = document.getElementById('course-name').value.trim();
      const code = document.getElementById('course-code').value.trim();
      const description = document.getElementById('course-description').value.trim();
      const duration = document.getElementById('course-duration').value.trim();
      const fee = parseFloat(document.getElementById('course-fee').value);
      const status = document.getElementById('course-status').value;

      // Get selected learning modes
      const modes = [];
      document.querySelectorAll('input[name="learning_modes"]:checked').forEach(cb => {
        modes.push(cb.value);
      });

      if (!name || !code || !fee) {
        showToast('Please fill in all required fields', 'error');
        return;
      }

      if (modes.length === 0) {
        showToast('Please select at least one learning mode', 'error');
        return;
      }

      const btn = document.getElementById('save-course-btn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-sm"></span> Saving...';

      try {
        const courseData = {
          name,
          course_code: code,
          description,
          duration,
          fee,
          learning_modes: modes.join(','),
          status
        };

        if (editingCourseId) {
          // Update existing course
          const { error } = await getSupabase()
            .from('courses')
            .update(courseData)
            .eq('id', editingCourseId);

          if (error) throw error;
          showToast('Course updated successfully', 'success');
        } else {
          // Create new course
          const { error } = await getSupabase()
            .from('courses')
            .insert(courseData);

          if (error) throw error;
          showToast('Course created successfully', 'success');
        }

        closeModal('course-modal');
        resetCourseForm();
        loadCourses();

      } catch (error) {
        console.error('Error saving course:', error);
        showToast(error.message || 'Failed to save course', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Save Course';
      }
    }

    function resetCourseForm() {
      editingCourseId = null;
      document.getElementById('modal-title').textContent = 'Add New Course';
      document.getElementById('course-form').reset();
      document.getElementById('course-id').value = '';
      document.querySelectorAll('input[name="learning_modes"]').forEach(cb => {
        cb.checked = cb.value === 'online';
      });
    }
  </script>
</body>
</html>
