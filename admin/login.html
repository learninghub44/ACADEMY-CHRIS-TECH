<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin Sign In - ChrisTech Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/auth.css">
  <style>
    body {
      background-color: var(--primary-dark);
    }

    .admin-auth-layout {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-6);
    }

    .admin-auth-card {
      width: 100%;
      max-width: 400px;
      background-color: var(--surface);
      border-radius: var(--radius-lg);
      padding: var(--space-8);
      box-shadow: var(--shadow-lg);
    }

    .admin-auth-badge {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      padding: var(--space-1) var(--space-3);
      background-color: var(--primary-light);
      color: var(--primary);
      font-size: var(--text-xs);
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      border-radius: var(--radius-full);
      margin-bottom: var(--space-4);
    }

    .admin-auth-badge svg {
      width: 14px;
      height: 14px;
    }

    .admin-auth-header {
      text-align: center;
      margin-bottom: var(--space-6);
    }

    .admin-auth-logo {
      width: 48px;
      height: 48px;
      margin: 0 auto var(--space-4);
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--primary);
      color: var(--text-inverse);
      font-weight: 700;
      font-size: var(--text-lg);
      border-radius: var(--radius-lg);
    }

    .admin-auth-header h1 {
      font-size: var(--text-xl);
      margin-bottom: var(--space-1);
    }

    .admin-auth-header p {
      font-size: var(--text-sm);
      color: var(--text-secondary);
      margin: 0;
    }

    .admin-auth-footer {
      text-align: center;
      margin-top: var(--space-6);
      padding-top: var(--space-5);
      border-top: 1px solid var(--border);
    }

    .admin-auth-footer a {
      font-size: var(--text-sm);
      color: var(--text-muted);
    }

    .admin-auth-footer a:hover {
      color: var(--primary);
    }
  </style>
</head>
<body>
  <div class="admin-auth-layout">
    <div class="admin-auth-card">
      <div class="admin-auth-header">
        <div class="admin-auth-logo">CT</div>
        <span class="admin-auth-badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          Admin access
        </span>
        <h1>Admin Portal</h1>
        <p>Sign in to manage ChrisTech Academy</p>
      </div>

      <form id="admin-login-form">
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="admin@christech.co.ke" required autocomplete="username">
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-full">Sign In</button>
      </form>

      <div class="admin-auth-footer">
        <a href="../login.html">Not an admin? Sign in to the student portal</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/utilities.js"></script>
  <script>
    // Dedicated admin login — signs in, verifies role === 'admin', and
    // signs any non-admin account straight back out rather than
    // routing them anywhere, so this page never leaks student access.

    document.addEventListener('DOMContentLoaded', () => {
      checkExistingAdminSession();

      const form = document.getElementById('admin-login-form');
      form.addEventListener('submit', handleAdminLogin);
    });

    async function checkExistingAdminSession() {
      try {
        const session = await auth.getSession();
        if (!session) return;

        const { data: profile } = await getSupabase()
          .from('profiles')
          .select('role')
          .eq('user_id', session.user.id)
          .single();

        if (profile && profile.role === 'admin') {
          window.location.href = 'dashboard.html';
        }
      } catch (error) {
        console.error('Session check error:', error);
      }
    }

    async function handleAdminLogin(e) {
      e.preventDefault();

      const form = e.target;
      const email = form.querySelector('[name="email"]').value.trim();
      const password = form.querySelector('[name="password"]').value;

      if (!email || !password) {
        showToast('Please fill in all fields', 'error');
        return;
      }

      if (!validateEmail(email)) {
        showToast('Please enter a valid email address', 'error');
        return;
      }

      const submitBtn = form.querySelector('[type="submit"]');
      const originalText = submitBtn.textContent;
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner-sm"></span> Signing in...';

      try {
        const { user } = await auth.signIn(email, password);

        const { data: profile, error: profileError } = await getSupabase()
          .from('profiles')
          .select('*')
          .eq('user_id', user.id)
          .single();

        if (profileError || !profile) {
          await getSupabase().auth.signOut();
          throw new Error('Profile not found. Please contact support.');
        }

        if (profile.role !== 'admin') {
          // Not an admin: sign this session out immediately, do not
          // route to any dashboard from this portal.
          await getSupabase().auth.signOut();
          throw new Error('This portal is for administrators only.');
        }

        if (profile.status === CONFIG.STATUS.SUSPENDED) {
          await getSupabase().auth.signOut();
          throw new Error('Your admin account has been suspended. Please contact support.');
        }

        showToast('Welcome back!', 'success');

        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 800);

      } catch (error) {
        showToast(error.message || 'Sign in failed. Please try again.', 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = originalText;
      }
    }
  </script>
</body>
</html>
