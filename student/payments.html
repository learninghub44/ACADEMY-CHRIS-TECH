<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment History - ChrisTech Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/student.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header"><div class="sidebar-logo">CT</div><div class="sidebar-brand"><h1>ChrisTech Academy</h1><span>Student Portal</span></div></div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
      <div class="sidebar-footer"><div class="sidebar-user"><div class="avatar" id="user-avatar">U</div><div class="sidebar-user-info"><div class="sidebar-user-name" id="user-name">Loading...</div><div class="sidebar-user-role">Student</div></div></div></div>
    </aside>
    <div class="sidebar-overlay"></div>
    <main class="main">
      <header class="header">
        <div class="header-left">
          <button class="mobile-menu-btn" id="mobile-menu-btn"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
          <h2 class="header-title">Payment History</h2>
        </div>
        <div class="header-right">
          <button class="header-btn" id="logout-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
        </div>
      </header>
      <div class="content">
        <div id="payments-container">
          <div class="loading-state"><div class="spinner"></div><p>Loading payment history...</p></div>
        </div>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/utilities.js"></script>
  <script>
    let currentUser = null, currentProfile = null, studentId = null;
    document.addEventListener('DOMContentLoaded', async function() {
      initSupabase(); initMobileMenu();
      const authResult = await checkAuth('student');
      if (!authResult) return;
      currentUser = authResult.user; currentProfile = authResult.profile;
      initSidebar(currentProfile);
      document.getElementById('user-name').textContent = currentProfile.full_name;
      document.getElementById('user-avatar').textContent = currentProfile.full_name.charAt(0).toUpperCase();
      const { data: student } = await getSupabase().from('students').select('id').eq('profile_id', currentUser.id).single();
      if (student) { studentId = student.id; loadPayments(); }
      document.getElementById('logout-btn').addEventListener('click', async () => { await auth.signOut(); window.location.href = '/login.html'; });
    });

    async function loadPayments() {
      try {
        const { data: payments, error } = await getSupabase().from('payments')
          .select('*, enrollments(courses(name, course_code))').eq('student_id', studentId).order('created_at', { ascending: false });
        if (error) throw error;
        const container = document.getElementById('payments-container');
        if (!payments || payments.length === 0) { showEmpty(container, 'No payment records yet.'); return; }
        container.innerHTML = `
          <div class="table-container">
            <table class="table"><thead><tr><th>Date</th><th>Course</th><th>Amount</th><th>Reference</th><th>Method</th><th>Status</th></tr></thead>
            <tbody>${payments.map(p => `<tr>
              <td>${formatDateTime(p.created_at)}</td>
              <td>${p.enrollments?.courses?.name || 'N/A'}</td>
              <td style="font-weight: 600;">${formatCurrency(p.amount)}</td>
              <td><code style="font-size: var(--text-xs);">${p.paystack_reference || 'N/A'}</code></td>
              <td>${p.payment_method || 'Paystack'}</td>
              <td><span class="badge badge-${p.status === 'successful' ? 'success' : p.status === 'pending' ? 'warning' : 'error'}">${p.status}</span></td>
            </tr>`).join('')}</tbody></table>
          </div>`;
      } catch (error) { console.error(error); showError(document.getElementById('payments-container'), 'Failed to load payments'); }
    }
  </script>
</body>
</html>
