<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Announcements - ChrisTech Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/student.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">CT</div>
        <div class="sidebar-brand">
          <h1>ChrisTech Academy</h1>
          <span>Student Portal</span>
        </div>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="avatar" id="user-avatar">U</div>
          <div class="sidebar-user-info">
            <div class="sidebar-user-name" id="user-name">Loading...</div>
            <div class="sidebar-user-role">Student</div>
          </div>
        </div>
      </div>
    </aside>

    <div class="sidebar-overlay"></div>

    <main class="main">
      <header class="header">
        <div class="header-left">
          <button class="mobile-menu-btn" id="mobile-menu-btn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="3" y1="12" x2="21" y2="12"/>
              <line x1="3" y1="6" x2="21" y2="6"/>
              <line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
          </button>
          <h2 class="header-title">Announcements</h2>
        </div>
        <div class="header-right">
          <button class="header-btn" id="logout-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
          </button>
        </div>
      </header>

      <div class="content">
        <div id="announcements-container">
          <div class="loading-state">
            <div class="spinner"></div>
            <p>Loading announcements...</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/utilities.js"></script>
  <script>
    let currentUser = null;
    let currentProfile = null;

    document.addEventListener('DOMContentLoaded', async function() {
      initSupabase();
      initMobileMenu();

      const authResult = await checkAuth('student');
      if (!authResult) return;

      currentUser = authResult.user;
      currentProfile = authResult.profile;

      initSidebar(currentProfile);
      document.getElementById('user-name').textContent = currentProfile.full_name;
      document.getElementById('user-avatar').textContent = currentProfile.full_name.charAt(0).toUpperCase();

      loadAnnouncements();

      document.getElementById('logout-btn').addEventListener('click', async () => {
        await auth.signOut();
        window.location.href = '/login.html';
      });
    });

    async function loadAnnouncements() {
      try {
        const { data: announcements, error } = await getSupabase()
          .from('announcements')
          .select('*')
          .eq('status', 'active')
          .lte('published_date', new Date().toISOString())
          .order('published_date', { ascending: false });

        if (error) throw error;

        const container = document.getElementById('announcements-container');

        if (!announcements || announcements.length === 0) {
          showEmpty(container, 'No announcements available at this time.');
          return;
        }

        container.innerHTML = announcements.map(announcement => `
          <div class="announcement-card" style="margin-bottom: var(--space-4);">
            <div class="announcement-card-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
              </svg>
            </div>
            <div class="announcement-card-content" style="flex: 1;">
              <h4 class="announcement-card-title">${announcement.title}</h4>
              <p class="announcement-card-date">${formatDateTime(announcement.published_date)}</p>
              <div class="announcement-card-text" style="margin-top: var(--space-3);">
                ${announcement.content}
              </div>
              ${announcement.target_audience !== 'all' ? `
                <div style="margin-top: var(--space-3);">
                  <span class="badge badge-info">
                    Target: ${announcement.target_audience === 'course' ? 'Specific Course' : announcement.target_learning_mode || 'Specific Group'}
                  </span>
                </div>
              ` : ''}
            </div>
          </div>
        `).join('');

      } catch (error) {
        console.error('Error loading announcements:', error);
        showError(document.getElementById('announcements-container'), 'Failed to load announcements');
      }
    }
  </script>
</body>
</html>
