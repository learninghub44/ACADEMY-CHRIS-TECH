<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Course - ChrisTech Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/student.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header"><div class="sidebar-logo">CT</div><div class="sidebar-brand"><h1>ChrisTech Academy</h1><span>Student Portal</span></div></div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
      <div class="sidebar-footer"><div class="sidebar-user"><div class="avatar" id="user-avatar">U</div><div class="sidebar-user-info"><div class="sidebar-user-name" id="user-name">Loading...</div><div class="sidebar-user-role">Student</div></div></div></div>
    </aside>
    <div class="sidebar-overlay"></div>
    <main class="main">
      <header class="header">
        <div class="header-left">
          <button class="mobile-menu-btn" id="mobile-menu-btn"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
          <h2 class="header-title" id="page-title">My Course</h2>
        </div>
        <div class="header-right">
          <button class="header-btn" id="logout-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
        </div>
      </header>
      <div class="content">
        <div id="course-content">
          <div class="loading-state"><div class="spinner"></div><p>Loading course...</p></div>
        </div>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/utilities.js"></script>
  <script>
    let currentUser = null, currentProfile = null, studentId = null, enrollmentId = null;
    document.addEventListener('DOMContentLoaded', async function() {
      initSupabase(); initMobileMenu();
      const authResult = await checkAuth('student');
      if (!authResult) return;
      currentUser = authResult.user; currentProfile = authResult.profile;
      initSidebar(currentProfile);
      document.getElementById('user-name').textContent = currentProfile.full_name;
      document.getElementById('user-avatar').textContent = currentProfile.full_name.charAt(0).toUpperCase();
      enrollmentId = new URLSearchParams(window.location.search).get('id');
      const { data: student } = await getSupabase().from('students').select('id').eq('profile_id', currentUser.id).single();
      if (student) { studentId = student.id; loadCourse(); }
      document.getElementById('logout-btn').addEventListener('click', async () => { await auth.signOut(); window.location.href = '/login.html'; });
    });

    async function loadCourse() {
      try {
        if (!enrollmentId) { showEmpty(document.getElementById('course-content'), 'No course selected. Go to "My Courses" to select one.'); return; }
        const { data: enrollment, error } = await getSupabase().from('enrollments')
          .select('*, courses(*)').eq('id', enrollmentId).eq('student_id', studentId).single();
        if (error || !enrollment) { showEmpty(document.getElementById('course-content'), 'Course not found.'); return; }
        const course = enrollment.courses;
        document.getElementById('page-title').textContent = course.name;
        const { data: lessons } = await getSupabase().from('lessons')
          .select('id, title, module_id, modules(name)').eq('course_id', course.id).eq('is_published', true).order('order_number');
        const { data: completed } = await getSupabase().from('lesson_progress')
          .select('lesson_id').eq('enrollment_id', enrollmentId).eq('student_id', studentId).eq('is_completed', true);
        const completedIds = completed?.map(c => c.lesson_id) || [];
        const container = document.getElementById('course-content');
        let modulesHtml = '';
        if (lessons && lessons.length > 0) {
          const grouped = {};
          lessons.forEach(l => { const name = l.modules?.name || 'General'; if (!grouped[name]) grouped[name] = []; grouped[name].push(l); });
          modulesHtml = Object.entries(grouped).map(([name, modLessons]) => `
            <div style="margin-bottom: var(--space-6);">
              <h3 style="margin-bottom: var(--space-3);">${name}</h3>
              <div style="display: grid; gap: var(--space-3);">
                ${modLessons.map((lesson, i) => {
                  const done = completedIds.includes(lesson.id);
                  return `<div class="lesson-card ${done ? 'completed' : ''}" style="cursor: pointer;" onclick="window.location.href='lessons.html'">
                    <div class="lesson-card-number">${done ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>' : (i+1)}</div>
                    <div class="lesson-card-content"><div class="lesson-card-title">${lesson.title}</div></div>
                    <span class="badge badge-${done ? 'success' : 'secondary'}">${done ? 'Completed' : 'Pending'}</span>
                  </div>`;
                }).join('')}
              </div>
            </div>
          `).join('');
        }
        container.innerHTML = `
          <div class="card" style="margin-bottom: var(--space-6);">
            <div class="card-body">
              <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: var(--space-4);">
                <div>
                  <h2 style="margin-bottom: var(--space-2);">${course.name}</h2>
                  <p style="margin: 0; color: var(--text-secondary);">${course.description || ''}</p>
                  <div style="display: flex; gap: var(--space-4); margin-top: var(--space-3); font-size: var(--text-sm); color: var(--text-muted);">
                    <span>Code: ${course.course_code}</span>
                    <span>Duration: ${course.duration || 'Flexible'}</span>
                    <span>Mode: ${enrollment.learning_mode}</span>
                  </div>
                </div>
                <div style="text-align: right; min-width: 200px;">
                  <div style="font-size: var(--text-3xl); font-weight: 700; color: var(--primary);">${enrollment.progress || 0}%</div>
                  <div style="font-size: var(--text-sm); color: var(--text-muted);">Course Progress</div>
                  <div class="progress" style="margin-top: var(--space-2);"><div class="progress-bar" style="width: ${enrollment.progress || 0}%"></div></div>
                </div>
              </div>
            </div>
          </div>
          ${modulesHtml || '<div class="empty-state"><p>No lessons available for this course yet.</p></div>'}
        `;
      } catch (error) { console.error(error); showError(document.getElementById('course-content'), 'Failed to load course'); }
    }
  </script>
</body>
</html>
