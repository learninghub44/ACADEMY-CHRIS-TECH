<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - ChrisTech Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/student.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">CT</div>
        <div class="sidebar-brand">
          <h1>ChrisTech Academy</h1>
          <span>Student Portal</span>
        </div>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="avatar" id="user-avatar">U</div>
          <div class="sidebar-user-info">
            <div class="sidebar-user-name" id="user-name">Loading...</div>
            <div class="sidebar-user-role">Student</div>
          </div>
        </div>
      </div>
    </aside>

    <div class="sidebar-overlay"></div>

    <main class="main">
      <header class="header">
        <div class="header-left">
          <button class="mobile-menu-btn" id="mobile-menu-btn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="3" y1="12" x2="21" y2="12"/>
              <line x1="3" y1="6" x2="21" y2="6"/>
              <line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
          </button>
          <h2 class="header-title">My Profile</h2>
        </div>
        <div class="header-right">
          <button class="header-btn" id="logout-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
          </button>
        </div>
      </header>

      <div class="content">
        <div style="display: grid; grid-template-columns: 1fr 2fr; gap: var(--space-6);">
          <!-- Profile Photo -->
          <div class="card">
            <div class="card-body" style="text-align: center;">
              <div class="avatar avatar-xl" style="margin: 0 auto var(--space-4); font-size: var(--text-3xl);" id="profile-avatar">U</div>
              <h3 id="profile-name">Loading...</h3>
              <p style="color: var(--text-muted); margin-bottom: var(--space-4);" id="profile-number">Student Number: --</p>
              <div style="display: flex; flex-direction: column; gap: var(--space-2);">
                <span class="badge badge-primary" id="profile-mode">Online</span>
                <span class="badge badge-success" id="profile-status">Active</span>
              </div>
            </div>
          </div>

          <!-- Profile Details -->
          <div class="card">
            <div class="card-header" style="display: flex; justify-content: space-between; align-items: center;">
              <h3>Personal Information</h3>
              <button class="btn btn-primary btn-sm" id="edit-profile-btn">Edit Profile</button>
            </div>
            <div class="card-body">
              <form id="profile-form">
                <div class="admin-form-grid">
                  <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" id="full_name" class="form-control" required>
                  </div>
                  <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" id="email" class="form-control" disabled>
                  </div>
                  <div class="form-group">
                    <label class="form-label">Phone Number</label>
                    <input type="tel" id="phone" class="form-control">
                  </div>
                  <div class="form-group">
                    <label class="form-label">Gender</label>
                    <select id="gender" class="form-control">
                      <option value="">Select gender</option>
                      <option value="male">Male</option>
                      <option value="female">Female</option>
                      <option value="other">Other</option>
                    </select>
                  </div>
                  <div class="form-group">
                    <label class="form-label">Date of Birth</label>
                    <input type="date" id="date_of_birth" class="form-control">
                  </div>
                  <div class="form-group">
                    <label class="form-label">Learning Preference</label>
                    <select id="learning_preference" class="form-control">
                      <option value="online">Online</option>
                      <option value="physical">Physical</option>
                      <option value="hybrid">Hybrid</option>
                    </select>
                  </div>
                </div>

                <div class="form-group" style="margin-top: var(--space-4);">
                  <button type="submit" class="btn btn-primary" id="save-profile-btn" disabled>
                    Save Changes
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>

        <!-- Documents Section -->
        <div class="card" style="margin-top: var(--space-6);">
          <div class="card-header">
            <h3>My Documents</h3>
          </div>
          <div class="card-body">
            <div id="documents-container">
              <div class="loading-state">
                <div class="spinner"></div>
                <p>Loading documents...</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/utilities.js"></script>
  <script>
    let currentUser = null;
    let currentProfile = null;
    let studentId = null;
    let isEditing = false;

    document.addEventListener('DOMContentLoaded', async function() {
      initSupabase();
      initMobileMenu();

      const authResult = await checkAuth('student');
      if (!authResult) return;

      currentUser = authResult.user;
      currentProfile = authResult.profile;

      initSidebar(currentProfile);
      document.getElementById('user-name').textContent = currentProfile.full_name;
      document.getElementById('user-avatar').textContent = currentProfile.full_name.charAt(0).toUpperCase();

      // Load profile data
      loadProfileData();

      // Get student record
      const { data: student } = await getSupabase()
        .from('students')
        .select('id, student_number')
        .eq('profile_id', currentUser.id)
        .single();

      if (student) {
        studentId = student.id;
        document.getElementById('profile-number').textContent = `Student Number: ${student.student_number}`;
        loadDocuments();
      }

      // Edit profile button
      document.getElementById('edit-profile-btn').addEventListener('click', toggleEdit);

      // Save profile form
      document.getElementById('profile-form').addEventListener('submit', handleSaveProfile);

      // Logout
      document.getElementById('logout-btn').addEventListener('click', async () => {
        await auth.signOut();
        window.location.href = '/login.html';
      });
    });

    function loadProfileData() {
      document.getElementById('profile-avatar').textContent = currentProfile.full_name.charAt(0).toUpperCase();
      document.getElementById('profile-name').textContent = currentProfile.full_name;
      document.getElementById('profile-mode').textContent = currentProfile.learning_preference || 'Online';
      document.getElementById('profile-status').textContent = currentProfile.status || 'Active';

      // Fill form
      document.getElementById('full_name').value = currentProfile.full_name || '';
      document.getElementById('email').value = currentProfile.email || '';
      document.getElementById('phone').value = currentProfile.phone || '';
      document.getElementById('gender').value = currentProfile.gender || '';
      document.getElementById('date_of_birth').value = currentProfile.date_of_birth || '';
      document.getElementById('learning_preference').value = currentProfile.learning_preference || 'online';
    }

    function toggleEdit() {
      isEditing = !isEditing;
      const form = document.getElementById('profile-form');
      const inputs = form.querySelectorAll('input:not([disabled]), select');
      const saveBtn = document.getElementById('save-profile-btn');
      const editBtn = document.getElementById('edit-profile-btn');

      inputs.forEach(input => {
        if (input.id !== 'email') {
          input.disabled = !isEditing;
        }
      });

      saveBtn.disabled = !isEditing;
      editBtn.textContent = isEditing ? 'Cancel' : 'Edit Profile';
    }

    async function handleSaveProfile(e) {
      e.preventDefault();

      const btn = document.getElementById('save-profile-btn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-sm"></span> Saving...';

      try {
        const updates = {
          full_name: document.getElementById('full_name').value.trim(),
          phone: document.getElementById('phone').value.trim(),
          gender: document.getElementById('gender').value || null,
          date_of_birth: document.getElementById('date_of_birth').value || null,
          learning_preference: document.getElementById('learning_preference').value
        };

        // Update profile
        const { error: profileError } = await getSupabase()
          .from('profiles')
          .update(updates)
          .eq('user_id', currentUser.id);

        if (profileError) throw profileError;

        // Update student record
        if (studentId) {
          const { error: studentError } = await getSupabase()
            .from('students')
            .update({
              full_name: updates.full_name,
              phone: updates.phone,
              gender: updates.gender,
              date_of_birth: updates.date_of_birth,
              learning_preference: updates.learning_preference
            })
            .eq('id', studentId);

          if (studentError) throw studentError;
        }

        showToast('Profile updated successfully', 'success');

        // Update displayed info
        document.getElementById('profile-name').textContent = updates.full_name;
        document.getElementById('profile-avatar').textContent = updates.full_name.charAt(0).toUpperCase();
        document.getElementById('profile-mode').textContent = updates.learning_preference;

        toggleEdit();

      } catch (error) {
        console.error('Error updating profile:', error);
        showToast(error.message || 'Failed to update profile', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Save Changes';
      }
    }

    async function loadDocuments() {
      try {
        const { data: documents, error } = await getSupabase()
          .from('documents')
          .select('*')
          .eq('student_id', studentId)
          .order('created_at', { ascending: false });

        if (error) throw error;

        const container = document.getElementById('documents-container');

        if (!documents || documents.length === 0) {
          showEmpty(container, 'No documents uploaded yet.');
          return;
        }

        container.innerHTML = `
          <div style="display: grid; gap: var(--space-3);">
            ${documents.map(doc => `
              <div class="document-card">
                <div class="document-card-icon">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                  </svg>
                </div>
                <div class="document-card-content">
                  <div class="document-card-name">${doc.document_type.replace('_', ' ').toUpperCase()}</div>
                  <div class="document-card-meta">Uploaded: ${formatDate(doc.created_at)}</div>
                </div>
                <span class="badge badge-${doc.status === 'approved' ? 'success' : doc.status === 'rejected' ? 'error' : 'warning'}">${doc.status}</span>
                ${doc.status === 'rejected' && doc.rejection_reason ? `
                  <div style="font-size: var(--text-xs); color: var(--error); margin-top: var(--space-2);">${doc.rejection_reason}</div>
                ` : ''}
              </div>
            `).join('')}
          </div>
        `;

      } catch (error) {
        console.error('Error loading documents:', error);
        showError(document.getElementById('documents-container'), 'Failed to load documents');
      }
    }
  </script>
</body>
</html>
