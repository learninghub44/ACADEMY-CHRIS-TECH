<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - ChrisTech Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/student.css">
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">CT</div>
        <div class="sidebar-brand">
          <h1>ChrisTech Academy</h1>
          <span>Student Portal</span>
        </div>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav">
        <!-- Navigation items loaded dynamically -->
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-user" id="user-menu">
          <div class="avatar" id="user-avatar">U</div>
          <div class="sidebar-user-info">
            <div class="sidebar-user-name" id="user-name">Loading...</div>
            <div class="sidebar-user-role">Student</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay"></div>

    <!-- Main Content -->
    <main class="main">
      <header class="header">
        <div class="header-left">
          <button class="mobile-menu-btn" id="mobile-menu-btn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="3" y1="12" x2="21" y2="12"/>
              <line x1="3" y1="6" x2="21" y2="6"/>
              <line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
          </button>
          <h2 class="header-title">Dashboard</h2>
        </div>
        <div class="header-right">
          <button class="header-btn" id="notifications-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
            </svg>
          </button>
          <button class="header-btn" id="logout-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
          </button>
        </div>
      </header>

      <div class="content">
        <!-- Stats -->
        <div class="dashboard-stats" id="dashboard-stats">
          <div class="stat-card">
            <div class="stat-card-header">
              <div class="stat-card-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                  <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
                </svg>
              </div>
            </div>
            <div class="stat-card-value" id="stat-courses">0</div>
            <div class="stat-card-label">Enrolled Courses</div>
          </div>
          <div class="stat-card">
            <div class="stat-card-header">
              <div class="stat-card-icon success">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                  <polyline points="22 4 12 14.01 9 11.01"/>
                </svg>
              </div>
            </div>
            <div class="stat-card-value" id="stat-progress">0%</div>
            <div class="stat-card-label">Average Progress</div>
          </div>
          <div class="stat-card">
            <div class="stat-card-header">
              <div class="stat-card-icon warning">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="1" y="4" width="22" height="16" rx="2" ry="2"/>
                  <line x1="1" y1="10" x2="23" y2="10"/>
                </svg>
              </div>
            </div>
            <div class="stat-card-value" id="stat-paid">KES 0</div>
            <div class="stat-card-label">Total Paid</div>
          </div>
          <div class="stat-card">
            <div class="stat-card-header">
              <div class="stat-card-icon error">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="10"/>
                  <line x1="12" y1="8" x2="12" y2="12"/>
                  <line x1="12" y1="16" x2="12.01" y2="16"/>
                </svg>
              </div>
            </div>
            <div class="stat-card-value" id="stat-balance">KES 0</div>
            <div class="stat-card-label">Outstanding Balance</div>
          </div>
        </div>

        <div class="dashboard-main-grid">
          <!-- My Courses -->
          <div class="section">
            <div class="section-header">
              <h3 class="section-title">My Courses</h3>
              <a href="courses.html" class="btn btn-ghost btn-sm">View All</a>
            </div>
            <div id="my-courses">
              <div class="loading-state">
                <div class="spinner"></div>
                <p>Loading courses...</p>
              </div>
            </div>
          </div>

          <!-- Sidebar Content -->
          <div>
            <!-- Recent Payments -->
            <div class="section">
              <div class="section-header">
                <h3 class="section-title">Recent Payments</h3>
                <a href="payments.html" class="btn btn-ghost btn-sm">View All</a>
              </div>
              <div id="recent-payments">
                <div class="loading-state">
                  <div class="spinner"></div>
                  <p>Loading payments...</p>
                </div>
              </div>
            </div>

            <!-- Recent Announcements -->
            <div class="section">
              <div class="section-header">
                <h3 class="section-title">Announcements</h3>
                <a href="announcements.html" class="btn btn-ghost btn-sm">View All</a>
              </div>
              <div id="recent-announcements">
                <div class="loading-state">
                  <div class="spinner"></div>
                  <p>Loading announcements...</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/utilities.js"></script>
  <script>
    let currentUser = null;
    let currentProfile = null;

    document.addEventListener('DOMContentLoaded', async function() {
      initSupabase();
      initMobileMenu();

      // Check authentication
      const authResult = await checkAuth('student');
      if (!authResult) return;

      currentUser = authResult.user;
      currentProfile = authResult.profile;

      // Initialize sidebar
      initSidebar(currentProfile);

      // Update user info
      document.getElementById('user-name').textContent = currentProfile.full_name;
      document.getElementById('user-avatar').innerHTML = `<img src="${getAvatarUrl(currentProfile.full_name)}" alt="${currentProfile.full_name}">`;

      // Load dashboard data
      loadDashboardData();

      // Logout handler
      document.getElementById('logout-btn').addEventListener('click', async () => {
        await auth.signOut();
        window.location.href = '/login.html';
      });
    });

    async function loadDashboardData() {
      try {
        // Get student record
        const { data: student } = await getSupabase()
          .from('students')
          .select('*')
          .eq('profile_id', currentUser.id)
          .single();

        if (!student) {
          showEmpty(document.getElementById('my-courses'), 'No courses enrolled yet.');
          return;
        }

        // Get enrollments with course info
        const { data: enrollments } = await getSupabase()
          .from('enrollments')
          .select(`
            *,
            courses (*)
          `)
          .eq('student_id', student.id)
          .eq('status', 'active');

        // Update stats
        document.getElementById('stat-courses').textContent = enrollments ? enrollments.length : 0;

        // Calculate average progress
        let totalProgress = 0;
        if (enrollments && enrollments.length > 0) {
          enrollments.forEach(e => {
            totalProgress += e.progress || 0;
          });
          const avgProgress = Math.round(totalProgress / enrollments.length);
          document.getElementById('stat-progress').textContent = avgProgress + '%';
        }

        // Get payment summary
        const { data: payments } = await getSupabase()
          .from('payments')
          .select('amount, status')
          .eq('student_id', student.id)
          .eq('status', 'successful');

        let totalPaid = 0;
        if (payments) {
          payments.forEach(p => totalPaid += p.amount);
        }
        document.getElementById('stat-paid').textContent = formatCurrency(totalPaid);

        // Calculate outstanding balance
        let totalFees = 0;
        if (enrollments) {
          enrollments.forEach(e => {
            if (e.courses) totalFees += e.courses.fee;
          });
        }
        const balance = calculateBalance(totalFees, totalPaid);
        document.getElementById('stat-balance').textContent = formatCurrency(balance);

        // Render enrolled courses
        if (enrollments && enrollments.length > 0) {
          renderEnrolledCourses(enrollments);
        } else {
          showEmpty(document.getElementById('my-courses'), 'No courses enrolled yet. <a href="courses.html">Browse courses</a>');
        }

        // Load recent payments
        loadRecentPayments(student.id);

        // Load recent announcements
        loadRecentAnnouncements();

      } catch (error) {
        console.error('Dashboard error:', error);
        showToast('Failed to load dashboard data', 'error');
      }
    }

    function renderEnrolledCourses(enrollments) {
      const container = document.getElementById('my-courses');
      container.innerHTML = `
        <div style="display: grid; gap: var(--space-4);">
          ${enrollments.map(enrollment => `
            <div class="enrolled-course-card">
              <div class="enrolled-course-header">
                <div class="enrolled-course-info">
                  <h3>${enrollment.courses?.name || 'Course'}</h3>
                  <p>${enrollment.learning_mode} Learning</p>
                </div>
                <span class="badge badge-primary">${enrollment.status}</span>
              </div>
              <div class="enrolled-course-progress">
                <div class="progress-text">
                  <span>Progress</span>
                  <span>${enrollment.progress || 0}%</span>
                </div>
                <div class="progress">
                  <div class="progress-bar" style="width: ${enrollment.progress || 0}%"></div>
                </div>
              </div>
              <div class="enrolled-course-stats">
                <span>Fee: ${formatCurrency(enrollment.courses?.fee || 0)}</span>
                <a href="course.html?id=${enrollment.id}" class="btn btn-primary btn-sm">Continue Learning</a>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    async function loadRecentPayments(studentId) {
      const { data: payments } = await getSupabase()
        .from('payments')
        .select('*')
        .eq('student_id', studentId)
        .order('created_at', { ascending: false })
        .limit(5);

      const container = document.getElementById('recent-payments');

      if (!payments || payments.length === 0) {
        showEmpty(container, 'No payments recorded yet.');
        return;
      }

      container.innerHTML = payments.map(payment => `
        <div class="payment-card" style="margin-bottom: var(--space-3);">
          <div class="payment-card-icon ${payment.status === 'successful' ? '' : payment.status === 'pending' ? 'pending' : 'failed'}">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="1" y="4" width="22" height="16" rx="2" ry="2"/>
              <line x1="1" y1="10" x2="23" y2="10"/>
            </svg>
          </div>
          <div class="payment-card-content">
            <div class="payment-card-amount">${formatCurrency(payment.amount)}</div>
            <div class="payment-card-date">${formatDate(payment.created_at)}</div>
          </div>
          <span class="badge badge-${payment.status === 'successful' ? 'success' : payment.status === 'pending' ? 'warning' : 'error'}">${payment.status}</span>
        </div>
      `).join('');
    }

    async function loadRecentAnnouncements() {
      const { data: announcements } = await getSupabase()
        .from('announcements')
        .select('*')
        .eq('status', 'active')
        .lte('published_date', new Date().toISOString())
        .order('published_date', { ascending: false })
        .limit(3);

      const container = document.getElementById('recent-announcements');

      if (!announcements || announcements.length === 0) {
        showEmpty(container, 'No announcements available.');
        return;
      }

      container.innerHTML = announcements.map(announcement => `
        <div class="announcement-card">
          <div class="announcement-card-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>
          </div>
          <div class="announcement-card-content">
            <h4 class="announcement-card-title">${announcement.title}</h4>
            <p class="announcement-card-date">${formatDate(announcement.published_date)}</p>
            <p class="announcement-card-text">${announcement.content.substring(0, 100)}...</p>
          </div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
