<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Courses - ChrisTech Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/student.css">
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">CT</div>
        <div class="sidebar-brand">
          <h1>ChrisTech Academy</h1>
          <span>Student Portal</span>
        </div>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <div class="sidebar-user" id="user-menu">
          <div class="avatar" id="user-avatar">U</div>
          <div class="sidebar-user-info">
            <div class="sidebar-user-name" id="user-name">Loading...</div>
            <div class="sidebar-user-role">Student</div>
          </div>
        </div>
      </div>
    </aside>

    <div class="sidebar-overlay"></div>

    <main class="main">
      <header class="header">
        <div class="header-left">
          <button class="mobile-menu-btn" id="mobile-menu-btn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="3" y1="12" x2="21" y2="12"/>
              <line x1="3" y1="6" x2="21" y2="6"/>
              <line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
          </button>
          <h2 class="header-title">Available Courses</h2>
        </div>
        <div class="header-right">
          <button class="header-btn" id="logout-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
          </button>
        </div>
      </header>

      <div class="content">
        <!-- Filters -->
        <div class="card" style="margin-bottom: var(--space-6);">
          <div class="card-body">
            <div style="display: flex; gap: var(--space-4); flex-wrap: wrap; align-items: center;">
              <div class="search-input" style="flex: 1; min-width: 200px;">
                <span class="search-input-icon">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                  </svg>
                </span>
                <input type="text" id="search-courses" class="form-control" placeholder="Search courses..." style="padding-left: 2.5rem;">
              </div>
              <select id="filter-mode" class="form-control" style="width: auto; min-width: 150px;">
                <option value="">All Learning Modes</option>
                <option value="online">Online</option>
                <option value="physical">Physical</option>
                <option value="hybrid">Hybrid</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Courses Grid -->
        <div id="courses-container">
          <div class="loading-state">
            <div class="spinner"></div>
            <p>Loading courses...</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Enrollment Modal -->
  <div class="modal" id="enrollment-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Enroll in Course</h3>
        <button class="modal-close" onclick="closeModal('enrollment-modal')">&times;</button>
      </div>
      <div class="modal-body">
        <div id="enrollment-course-info"></div>
        <div class="form-group">
          <label class="form-label">Select Learning Mode</label>
          <select id="enrollment-mode" class="form-control">
            <option value="online">Online</option>
            <option value="physical">Physical</option>
            <option value="hybrid">Hybrid</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('enrollment-modal')">Cancel</button>
        <button class="btn btn-primary" id="confirm-enrollment-btn">Confirm Enrollment</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/utilities.js"></script>
  <script>
    let currentUser = null;
    let currentProfile = null;
    let studentId = null;
    let courses = [];
    let selectedCourse = null;

    document.addEventListener('DOMContentLoaded', async function() {
      initSupabase();
      initMobileMenu();

      const authResult = await checkAuth('student');
      if (!authResult) return;

      currentUser = authResult.user;
      currentProfile = authResult.profile;

      initSidebar(currentProfile);
      document.getElementById('user-name').textContent = currentProfile.full_name;
      document.getElementById('user-avatar').textContent = currentProfile.full_name.charAt(0).toUpperCase();

      // Get student record
      const { data: student } = await getSupabase()
        .from('students')
        .select('id')
        .eq('profile_id', currentUser.id)
        .single();

      if (student) studentId = student.id;

      // Load courses
      loadCourses();

      // Search and filter
      document.getElementById('search-courses').addEventListener('input', debounce(filterCourses, 300));
      document.getElementById('filter-mode').addEventListener('change', filterCourses);

      // Enrollment button
      document.getElementById('confirm-enrollment-btn').addEventListener('click', handleEnrollment);

      // Logout
      document.getElementById('logout-btn').addEventListener('click', async () => {
        await auth.signOut();
        window.location.href = '/login.html';
      });
    });

    async function loadCourses() {
      try {
        const { data, error } = await getSupabase()
          .from('courses')
          .select('*')
          .eq('status', 'active')
          .order('created_at', { ascending: false });

        if (error) throw error;
        courses = data || [];
        renderCourses(courses);
      } catch (error) {
        console.error('Error loading courses:', error);
        showError(document.getElementById('courses-container'), 'Failed to load courses');
      }
    }

    function filterCourses() {
      const search = document.getElementById('search-courses').value.toLowerCase();
      const mode = document.getElementById('filter-mode').value;

      let filtered = courses.filter(course => {
        const matchesSearch = course.name.toLowerCase().includes(search) ||
                            course.description?.toLowerCase().includes(search);
        const matchesMode = !mode || course.learning_modes?.includes(mode);
        return matchesSearch && matchesMode;
      });

      renderCourses(filtered);
    }

    function renderCourses(coursesToRender) {
      const container = document.getElementById('courses-container');

      if (!coursesToRender || coursesToRender.length === 0) {
        showEmpty(container, 'No courses available at the moment.');
        return;
      }

      container.innerHTML = `
        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: var(--space-6);">
          ${coursesToRender.map(course => `
            <div class="course-card">
              <div class="course-card-image">
                ${course.image_url
                  ? `<img src="${course.image_url}" alt="${course.name}">`
                  : `<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                      <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
                    </svg>`
                }
              </div>
              <div class="course-card-content">
                <h3 class="course-card-title">${course.name}</h3>
                <p class="course-card-code">${course.course_code}</p>
                <p class="course-card-description">${course.description || 'No description available.'}</p>
                <div class="course-card-meta">
                  <span class="course-card-meta-item">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <circle cx="12" cy="12" r="10"/>
                      <polyline points="12 6 12 12 16 14"/>
                    </svg>
                    ${course.duration || 'Flexible'}
                  </span>
                  <span class="course-card-meta-item">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                      <circle cx="12" cy="7" r="4"/>
                    </svg>
                    ${course.learning_modes || 'Online'}
                  </span>
                </div>
                <div class="course-card-footer">
                  <span class="course-card-price">${formatCurrency(course.fee)}</span>
                  <button class="btn btn-primary btn-sm" onclick="openEnrollmentModal('${course.id}')">
                    Enroll Now
                  </button>
                </div>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function openEnrollmentModal(courseId) {
      selectedCourse = courses.find(c => c.id === courseId);
      if (!selectedCourse) return;

      document.getElementById('enrollment-course-info').innerHTML = `
        <div style="margin-bottom: var(--space-4); padding: var(--space-4); background: var(--background); border-radius: var(--radius-lg);">
          <h4 style="margin-bottom: var(--space-2);">${selectedCourse.name}</h4>
          <p style="margin: 0; font-size: var(--text-sm); color: var(--text-secondary);">${selectedCourse.course_code}</p>
          <p style="margin: var(--space-2) 0 0; font-size: var(--text-lg); font-weight: 600; color: var(--primary);">${formatCurrency(selectedCourse.fee)}</p>
        </div>
      `;

      // Set available learning modes
      const modeSelect = document.getElementById('enrollment-mode');
      modeSelect.innerHTML = '';
      const modes = selectedCourse.learning_modes?.split(',') || ['online'];
      modes.forEach(mode => {
        const option = document.createElement('option');
        option.value = mode.trim();
        option.textContent = mode.trim().charAt(0).toUpperCase() + mode.trim().slice(1);
        modeSelect.appendChild(option);
      });

      openModal('enrollment-modal');
    }

    async function handleEnrollment() {
      if (!selectedCourse || !studentId) {
        showToast('Please try again', 'error');
        return;
      }

      const mode = document.getElementById('enrollment-mode').value;
      const btn = document.getElementById('confirm-enrollment-btn');

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-sm"></span> Enrolling...';

      try {
        // Check for existing active enrollment
        const { data: existing } = await getSupabase()
          .from('enrollments')
          .select('id')
          .eq('student_id', studentId)
          .eq('course_id', selectedCourse.id)
          .eq('status', 'active')
          .single();

        if (existing) {
          throw new Error('You are already enrolled in this course');
        }

        // Create enrollment
        const { error } = await getSupabase()
          .from('enrollments')
          .insert({
            student_id: studentId,
            course_id: selectedCourse.id,
            learning_mode: mode,
            status: 'active',
            progress: 0
          });

        if (error) throw error;

        showToast('Successfully enrolled in the course!', 'success');
        closeModal('enrollment-modal');

        // Refresh courses to show enrollment status
        loadCourses();

      } catch (error) {
        showToast(error.message || 'Enrollment failed', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Confirm Enrollment';
      }
    }
  </script>
</body>
</html>
