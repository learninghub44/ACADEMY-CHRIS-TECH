<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignments - ChrisTech Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/student.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">CT</div>
        <div class="sidebar-brand">
          <h1>ChrisTech Academy</h1>
          <span>Student Portal</span>
        </div>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="avatar" id="user-avatar">U</div>
          <div class="sidebar-user-info">
            <div class="sidebar-user-name" id="user-name">Loading...</div>
            <div class="sidebar-user-role">Student</div>
          </div>
        </div>
      </div>
    </aside>

    <div class="sidebar-overlay"></div>

    <main class="main">
      <header class="header">
        <div class="header-left">
          <button class="mobile-menu-btn" id="mobile-menu-btn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="3" y1="12" x2="21" y2="12"/>
              <line x1="3" y1="6" x2="21" y2="6"/>
              <line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
          </button>
          <h2 class="header-title">Assignments</h2>
        </div>
        <div class="header-right">
          <button class="header-btn" id="logout-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
          </button>
        </div>
      </header>

      <div class="content">
        <div id="assignments-container">
          <div class="loading-state">
            <div class="spinner"></div>
            <p>Loading assignments...</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Submit Assignment Modal -->
  <div class="modal" id="assignment-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="assignment-modal-title">Submit Assignment</h3>
        <button class="modal-close" onclick="closeModal('assignment-modal')">&times;</button>
      </div>
      <div class="modal-body">
        <div id="assignment-info" style="margin-bottom: var(--space-4);"></div>
        <form id="assignment-form">
          <div class="form-group">
            <label class="form-label">Submission Text (Optional)</label>
            <textarea id="submission-text" class="form-control" rows="4" placeholder="Enter your submission or notes"></textarea>
          </div>
          <div class="form-group">
            <label class="form-label">Attachment</label>
            <input type="file" id="submission-file" class="form-control" accept=".pdf,.doc,.docx,.zip,.png,.jpg,.jpeg">
            <p class="form-text">Max file size: 5MB. Allowed: PDF, Word, images, ZIP</p>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('assignment-modal')">Cancel</button>
        <button class="btn btn-primary" id="submit-assignment-btn">Submit</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/utilities.js"></script>
  <script>
    let currentUser = null;
    let currentProfile = null;
    let studentId = null;
    let currentAssignment = null;

    document.addEventListener('DOMContentLoaded', async function() {
      initSupabase();
      initMobileMenu();

      const authResult = await checkAuth('student');
      if (!authResult) return;

      currentUser = authResult.user;
      currentProfile = authResult.profile;

      initSidebar(currentProfile);
      document.getElementById('user-name').textContent = currentProfile.full_name;
      document.getElementById('user-avatar').textContent = currentProfile.full_name.charAt(0).toUpperCase();

      const { data: student } = await getSupabase()
        .from('students')
        .select('id')
        .eq('profile_id', currentUser.id)
        .single();

      if (student) {
        studentId = student.id;
        loadAssignments();
      }

      document.getElementById('submit-assignment-btn').addEventListener('click', submitAssignment);
      document.getElementById('logout-btn').addEventListener('click', async () => {
        await auth.signOut();
        window.location.href = '/login.html';
      });
    });

    async function loadAssignments() {
      try {
        // Get enrollments with course IDs
        const { data: enrollments } = await getSupabase()
          .from('enrollments')
          .select('course_id, id')
          .eq('student_id', studentId)
          .eq('status', 'active');

        if (!enrollments || enrollments.length === 0) {
          showEmpty(document.getElementById('assignments-container'), 'No assignments available. Enroll in a course first.');
          return;
        }

        const courseIds = enrollments.map(e => e.course_id);

        // Get assignments for enrolled courses
        const { data: assignments, error } = await getSupabase()
          .from('assignments')
          .select(`
            *,
            courses (name)
          `)
          .eq('is_published', true)
          .in('course_id', courseIds)
          .order('deadline', { ascending: true });

        if (error) throw error;

        // Get existing submissions
        const { data: submissions } = await getSupabase()
          .from('submissions')
          .select('assignment_id, status, marks, submitted_at')
          .eq('student_id', studentId);

        const container = document.getElementById('assignments-container');

        if (!assignments || assignments.length === 0) {
          showEmpty(container, 'No assignments available yet.', '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>');
          return;
        }

        container.innerHTML = `
          <div style="display: grid; gap: var(--space-4);">
            ${assignments.map(assignment => {
              const submission = submissions?.find(s => s.assignment_id === assignment.id);
              const deadlinePassed = assignment.deadline && new Date(assignment.deadline) < new Date();

              const statusBadge = submission
                ? (submission.status === 'graded'
                  ? `<span class="badge badge-success">Graded: ${submission.marks || 0} Marks</span>`
                  : `<span class="badge badge-info">Submitted</span>`)
                : (deadlinePassed
                  ? `<span class="badge badge-error">Deadline Passed</span>`
                  : `<span class="badge badge-warning">Not Submitted</span>`);

              return `
                <div class="assignment-card">
                  <div class="assignment-card-header">
                    <div>
                      <h3 class="assignment-card-title">${assignment.title}</h3>
                      <p class="assignment-card-deadline">
                        Deadline: ${assignment.deadline ? formatDateTime(assignment.deadline) : 'No deadline'} | Max: ${assignment.max_marks || 100} marks
                      </p>
                    </div>
                    ${statusBadge}
                  </div>
                  <p class="assignment-card-description" style="margin: 0 0 var(--space-3);">
                    ${assignment.description || 'No description available.'}
                    <div style="font-size: var(--text-xs); color: var(--text-muted);">
                      Course: ${assignment.courses?.name || 'N/A'}
                    </div>
                  </p>
                  <div class="assignment-card-footer">
                    <div>
                      ${submission?.submitted_at ? `<span style="font-size: var(--text-xs); color: var(--text-muted);">Submitted ${formatDate(submission.submitted_at)}</span>` : ''}
                    </div>
                    ${!submission && !deadlinePassed ? `
                      <button class="btn btn-primary btn-sm" onclick="openAssignmentModal('${assignment.id}')">Submit</button>
                    ` : submission?.status === 'returned' ? `
                      <button class="btn btn-primary btn-sm" onclick="openAssignmentModal('${assignment.id}')">Resubmit</button>
                    ` : ''}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;

      } catch (error) {
        console.error('Error loading assignments:', error);
        showError(document.getElementById('assignments-container'), 'Failed to load assignments');
      }
    }

    async function openAssignmentModal(assignmentId) {
      try {
        const { data: assignment } = await getSupabase()
          .from('assignments')
          .select('*')
          .eq('id', assignmentId)
          .single();

        if (!assignment) return;

        currentAssignment = assignment;
        document.getElementById('assignment-modal-title').textContent = assignment.title;

        const { data: existing } = await getSupabase()
          .from('submissions')
          .select('submission_text')
          .eq('assignment_id', assignmentId)
          .eq('student_id', studentId)
          .single();

        document.getElementById('assignment-info').innerHTML = `
          <div style="padding: var(--space-4); background: var(--background); border-radius: var(--radius-lg);">
            <p style="margin: 0; font-size: var(--text-sm);">
              <strong>${assignment.title}</strong>
              <span style="display: block; margin-top: var(--space-2); color: var(--text-secondary);">${assignment.description || ''}</span>
              <span style="display: block; margin-top: var(--space-2); font-size: var(--text-xs); color: var(--text-muted);">
                Max marks: ${assignment.max_marks || 100}
              </span>
            </p>
          </div>
        `;

        if (existing?.submission_text) {
          document.getElementById('submission-text').value = existing.submission_text;
        } else {
          document.getElementById('submission-text').value = '';
        }
        document.getElementById('submission-file').value = '';

        openModal('assignment-modal');

      } catch (error) {
        console.error('Error opening assignment:', error);
        showToast('Failed to open assignment', 'error');
      }
    }

    async function submitAssignment() {
      if (!currentAssignment) return;

      const btn = document.getElementById('submit-assignment-btn');
      const text = document.getElementById('submission-text').value.trim();
      const file = document.getElementById('submission-file').files[0];

      if (!text && !file) {
        showToast('Please provide a submission text or attachment', 'error');
        return;
      }

      // Check file size
      if (file && file.size > CONFIG.MAX_FILE_SIZE) {
        showToast(`File too large. Max size: ${formatFileSize(CONFIG.MAX_FILE_SIZE)}`, 'error');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-sm"></span> Submitting...';

      try {
        let fileUrl = null;
        let filePath = null;

        // Upload file to storage if provided
        if (file) {
          filePath = `${studentId}/${currentAssignment.id}/${Date.now()}_${file.name}`;
          await storage.upload('assignment-submissions', filePath, file);
          const { data: uploaded } = await getSupabase().storage.from('assignment-submissions').getPublicUrl(filePath);
          fileUrl = uploaded.publicUrl;
        }

        // Upsert submission
        const { error } = await getSupabase()
          .from('submissions')
          .upsert({
            assignment_id: currentAssignment.id,
            student_id: studentId,
            submission_text: text || null,
            attachment_url: fileUrl,
            status: 'submitted',
            submitted_at: new Date().toISOString()
          }, {
            onConflict: 'assignment_id,student_id'
          });

        if (error) throw error;

        showToast('Assignment submitted successfully', 'success');
        closeModal('assignment-modal');
        loadAssignments();

      } catch (error) {
        console.error('Submit error:', error);
        showToast(error.message || 'Failed to submit assignment', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Submit';
      }
    }
  </script>
</body>
</html>
