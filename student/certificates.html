<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Certificates - ChrisTech Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/student.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">CT</div>
        <div class="sidebar-brand">
          <h1>ChrisTech Academy</h1>
          <span>Student Portal</span>
        </div>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="avatar" id="user-avatar">U</div>
          <div class="sidebar-user-info">
            <div class="sidebar-user-name" id="user-name">Loading...</div>
            <div class="sidebar-user-role">Student</div>
          </div>
        </div>
      </div>
    </aside>

    <div class="sidebar-overlay"></div>

    <main class="main">
      <header class="header">
        <div class="header-left">
          <button class="mobile-menu-btn" id="mobile-menu-btn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="3" y1="12" x2="21" y2="12"/>
              <line x1="3" y1="6" x2="21" y2="6"/>
              <line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
          </button>
          <h2 class="header-title">My Certificates</h2>
        </div>
        <div class="header-right">
          <button class="header-btn" id="logout-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
          </button>
        </div>
      </header>

      <div class="content">
        <div class="alert alert-info" style="margin-bottom: var(--space-6);">
          <strong>Certificate Requirements:</strong> To download your certificate, you must complete all course requirements AND fully pay all outstanding fees.
        </div>

        <div id="certificates-container">
          <div class="loading-state">
            <div class="spinner"></div>
            <p>Loading certificates...</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/utilities.js"></script>
  <script>
    let currentUser = null;
    let currentProfile = null;
    let studentId = null;

    document.addEventListener('DOMContentLoaded', async function() {
      initSupabase();
      initMobileMenu();

      const authResult = await checkAuth('student');
      if (!authResult) return;

      currentUser = authResult.user;
      currentProfile = authResult.profile;

      initSidebar(currentProfile);
      document.getElementById('user-name').textContent = currentProfile.full_name;
      document.getElementById('user-avatar').textContent = currentProfile.full_name.charAt(0).toUpperCase();

      const { data: student } = await getSupabase()
        .from('students')
        .select('id')
        .eq('profile_id', currentUser.id)
        .single();

      if (student) {
        studentId = student.id;
        loadCertificates();
      }

      document.getElementById('logout-btn').addEventListener('click', async () => {
        await auth.signOut();
        window.location.href = '/login.html';
      });
    });

    async function loadCertificates() {
      try {
        // Get enrollments with course info
        const { data: enrollments } = await getSupabase()
          .from('enrollments')
          .select(`
            *,
            courses (name, course_code, fee)
          `)
          .eq('student_id', studentId);

        // Get payments
        const { data: payments } = await getSupabase()
          .from('payments')
          .select('enrollment_id, amount')
          .eq('student_id', studentId)
          .eq('status', 'successful');

        // Get existing certificates
        const { data: certificates } = await getSupabase()
          .from('certificates')
          .select('*')
          .eq('student_id', studentId);

        const container = document.getElementById('certificates-container');

        if (!enrollments || enrollments.length === 0) {
          showEmpty(container, 'You are not enrolled in any courses yet.');
          return;
        }

        const certificatesHtml = enrollments.map(enrollment => {
          const courseFee = enrollment.courses?.fee || 0;
          const totalPaid = payments
            ? payments.filter(p => p.enrollment_id === enrollment.id).reduce((sum, p) => sum + p.amount, 0)
            : 0;
          const balance = calculateBalance(courseFee, totalPaid);
          const isPaid = balance === 0;
          const isCompleted = enrollment.status === 'completed';
          const certificate = certificates?.find(c => c.enrollment_id === enrollment.id);

          let statusMessage = '';
          let canDownload = false;

          if (certificate) {
            statusMessage = 'Certificate issued';
            canDownload = true;
          } else if (!isCompleted && !isPaid) {
            statusMessage = 'Complete course requirements and pay all fees to unlock certificate';
          } else if (!isCompleted) {
            statusMessage = 'Complete all course requirements first';
          } else if (!isPaid) {
            statusMessage = `Outstanding balance: ${formatCurrency(balance)}`;
          }

          return `
            <div class="certificate-card ${canDownload ? 'eligible' : ''}" style="margin-bottom: var(--space-6);">
              <div class="certificate-card-icon">
                ${canDownload
                  ? '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>'
                  : '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>'
                }
              </div>
              <h3>${enrollment.courses?.name || 'Course'}</h3>
              <p>${statusMessage}</p>

              <div class="certificate-details">
                <div class="certificate-detail">
                  <span class="certificate-detail-label">Course Code</span>
                  <span class="certificate-detail-value">${enrollment.courses?.course_code || 'N/A'}</span>
                </div>
                <div class="certificate-detail">
                  <span class="certificate-detail-label">Learning Mode</span>
                  <span class="certificate-detail-value">${enrollment.learning_mode}</span>
                </div>
                <div class="certificate-detail">
                  <span class="certificate-detail-label">Progress</span>
                  <span class="certificate-detail-value">${enrollment.progress || 0}%</span>
                </div>
                <div class="certificate-detail">
                  <span class="certificate-detail-label">Payment Status</span>
                  <span class="certificate-detail-value">${isPaid ? 'Fully Paid' : `Balance: ${formatCurrency(balance)}`}</span>
                </div>
                ${certificate ? `
                  <div class="certificate-detail">
                    <span class="certificate-detail-label">Certificate Number</span>
                    <span class="certificate-detail-value">${certificate.certificate_number}</span>
                  </div>
                  <div class="certificate-detail">
                    <span class="certificate-detail-label">Issued Date</span>
                    <span class="certificate-detail-value">${formatDate(certificate.issued_at)}</span>
                  </div>
                ` : ''}
              </div>

              ${canDownload ? `
                <div style="margin-top: var(--space-6);">
                  <button class="btn btn-success" onclick="downloadCertificate('${certificate.id}')">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                      <polyline points="7 10 12 15 17 10"/>
                      <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    Download Certificate
                  </button>
                </div>
              ` : ''}
            </div>
          `;
        }).join('');

        container.innerHTML = certificatesHtml;

      } catch (error) {
        console.error('Error loading certificates:', error);
        showError(document.getElementById('certificates-container'), 'Failed to load certificates');
      }
    }

    async function downloadCertificate(certificateId) {
      try {
        showToast('Preparing your certificate...', 'info');

        // Call edge function to generate/download certificate
        const { data, error } = await getSupabase().functions.invoke('generate-certificate', {
          body: { certificate_id: certificateId }
        });

        if (error) throw error;

        if (data.url) {
          window.open(data.url, '_blank');
          showToast('Certificate downloaded successfully', 'success');
        } else {
          throw new Error('Failed to generate certificate');
        }

      } catch (error) {
        console.error('Download error:', error);
        showToast(error.message || 'Failed to download certificate', 'error');
      }
    }
  </script>
</body>
</html>
